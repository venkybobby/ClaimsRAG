# Reindexes data/source_pdfs/ into Supabase whenever it changes, so the
# deployed API (Supabase-backed, see api/main.py) picks up new/revised
# documents without an app deploy. Independent of fly-deploy.yml on
# purpose: adding a PDF shouldn't trigger an app redeploy, and an app code
# change shouldn't trigger a reindex.
name: Index Corpus to Supabase

on:
  push:
    branches:
      - main
    paths:
      - "data/source_pdfs/**"
  workflow_dispatch: {}

jobs:
  index:
    name: Chunk, embed, push to Supabase
    runs-on: ubuntu-latest
    concurrency: index-group
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # CPU-only torch first, same reasoning as the Dockerfile: otherwise
      # sentence-transformers pulls the full CUDA build on a CPU runner.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - run: |
          python src/pdf_vector_indexer.py \
            --pdf-dir data/source_pdfs \
            --supabase-url "$SUPABASE_URL" \
            --supabase-key "$SUPABASE_SERVICE_ROLE_KEY"
        env:
          SUPABASE_URL: https://mtfyctrxmbbwxwohtdhr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
