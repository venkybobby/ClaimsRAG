<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CMS Coverage RAG — Chat</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --border: #2a313c;
    --text: #e6edf3; --muted: #8b949e; --accent: #4f8cff;
    --user-bubble: #1f6feb; --bot-bubble: #1c2128;
    --refuse: #7d2f2f; --refuse-border: #b5514f;
    --ok: #234d2f; --ok-border: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header p { margin: 0; font-size: 12px; color: var(--muted); }
  #status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--muted);
    flex-shrink: 0;
  }
  #status-dot.ready { background: var(--ok-border); }
  #chat {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    max-width: 820px; width: 100%; margin: 0 auto;
  }
  .msg { display: flex; flex-direction: column; gap: 6px; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
    line-height: 1.45; font-size: 14px;
  }
  .msg.user .bubble { background: var(--user-bubble); color: white; border-bottom-right-radius: 3px; }
  .msg.bot .bubble { background: var(--bot-bubble); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.bot .bubble.refused { background: var(--refuse); border-color: var(--refuse-border); }
  .msg.bot .bubble.answered { border-left: 3px solid var(--ok-border); }
  .badge {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 7px; border-radius: 999px; font-weight: 600;
  }
  .badge.refused { background: var(--refuse); border: 1px solid var(--refuse-border); color: #ffd7d5; }
  .badge.answered { background: var(--ok); border: 1px solid var(--ok-border); color: #b7f0c0; }
  .citations { display: flex; flex-direction: column; gap: 4px; margin-top: 2px; }
  .citation {
    font-size: 12px; color: var(--muted); font-family: ui-monospace, Consolas, monospace;
    padding: 4px 8px; background: #0d1117; border: 1px solid var(--border); border-radius: 6px;
  }
  .citation b { color: var(--text); }
  #inputbar {
    border-top: 1px solid var(--border); padding: 14px 20px;
    display: flex; gap: 10px; max-width: 820px; width: 100%; margin: 0 auto;
  }
  #q {
    flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 14px; border-radius: 10px; font-size: 14px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  #send {
    background: var(--accent); color: white; border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #send:disabled { opacity: 0.5; cursor: default; }
  .examples { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 10px; max-width: 820px; margin: 0 auto; width: 100%; }
  .example {
    font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 10px; cursor: pointer; background: var(--panel);
  }
  .example:hover { color: var(--text); border-color: var(--accent); }
  .typing { color: var(--muted); font-size: 13px; font-style: italic; }
</style>
</head>
<body>
  <header>
    <span id="status-dot"></span>
    <div>
      <h1>CMS Coverage RAG</h1>
      <p id="status-text">Connecting to service&hellip;</p>
    </div>
  </header>

  <div class="examples" id="examples"></div>
  <div id="chat"></div>

  <div id="inputbar">
    <input id="q" type="text" placeholder="Is a screening colonoscopy covered for a 55 year old at average risk?" autocomplete="off">
    <button id="send">Ask</button>
  </div>

<script>
const chat = document.getElementById('chat');
const qInput = document.getElementById('q');
const sendBtn = document.getElementById('send');
const statusDot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

const EXAMPLES = [
  "Is a screening colonoscopy covered for a 55 year old at average risk for colorectal cancer?",
  "Is cardiac rehab covered for a patient with heart failure and an ejection fraction of 40%?",
  "Is a total knee replacement covered for a 70 year old with severe osteoarthritis?",
];
const examplesEl = document.getElementById('examples');
EXAMPLES.forEach(ex => {
  const b = document.createElement('div');
  b.className = 'example';
  b.textContent = ex.length > 60 ? ex.slice(0, 57) + '...' : ex;
  b.title = ex;
  b.onclick = () => { qInput.value = ex; sendQuestion(); };
  examplesEl.appendChild(b);
});

function addMsg(role, html) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;
  wrap.innerHTML = html;
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
  return wrap;
}

function renderCitations(citations) {
  if (!citations || !citations.length) return '';
  const rows = citations.map(c =>
    `<div class="citation"><b>${c.similarity.toFixed(3)}</b> &nbsp;NCD ${c.display_id} "${c.title}" &mdash; ${c.section}, p.${c.page}</div>`
  ).join('');
  return `<div class="citations">${rows}</div>`;
}

async function sendQuestion() {
  const question = qInput.value.trim();
  if (!question) return;
  qInput.value = '';
  sendBtn.disabled = true;

  addMsg('user', `<div class="bubble">${escapeHtml(question)}</div>`);
  const typingEl = addMsg('bot', `<div class="typing">retrieving &amp; composing answer&hellip;</div>`);

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    const data = await res.json();
    typingEl.remove();

    const badge = data.refused
      ? '<span class="badge refused">Refused</span>'
      : '<span class="badge answered">Answered</span>';
    const bubbleClass = data.refused ? 'refused' : 'answered';

    addMsg('bot', `
      <div style="margin-bottom:4px">${badge}</div>
      <div class="bubble ${bubbleClass}">${escapeHtml(data.answer)}</div>
      ${renderCitations(data.citations)}
    `);
  } catch (err) {
    typingEl.remove();
    addMsg('bot', `<div class="bubble refused">Request failed: ${escapeHtml(String(err))}</div>`);
  } finally {
    sendBtn.disabled = false;
    qInput.focus();
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

sendBtn.onclick = sendQuestion;
qInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendQuestion(); });

async function checkHealth() {
  try {
    const res = await fetch('/health');
    const data = await res.json();
    if (data.status === 'ok') {
      statusDot.classList.add('ready');
      statusText.textContent = `Ready — ${data.chunks_indexed} chunks indexed, refusal threshold ${data.refusal_threshold}`;
      return true;
    }
  } catch (e) {}
  statusText.textContent = 'Waking up service (cold start can take ~20s)...';
  return false;
}

(async function poll() {
  const ok = await checkHealth();
  if (!ok) setTimeout(poll, 2000);
})();
</script>
</body>
</html>
